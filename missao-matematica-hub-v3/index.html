<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Missão Matemática</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf8}#shell{display:block;width:100%;height:100dvh;border:0}</style></head><body><iframe id="shell" src="/missao-matematica-hub-v2/index.html" title="Missão Matemática"></iframe><script>
const shell=document.getElementById('shell');
const CORR_KEY='missao-matematica-exam-correction-v3';
const GRADE_KEY='missao-matematica-grades-v1';
const MODULES=['Entendendo frações','Frações equivalentes, comparação e reta numérica','Adição e subtração de frações','Multiplicação de frações','Divisão de frações','Números decimais','Adição e subtração de decimais','Multiplicação de números decimais','Divisão de números decimais','Interpretação de problemas','Revisão mista'];
const TOPIC_MAP={1:['fracoes','Frações','hTGFQpuiq8M'],2:['fracoes','Frações','hTGFQpuiq8M'],3:['soma-fracoes','Adição de frações','hTGFQpuiq8M'],4:['soma-fracoes','Subtração de frações','hTGFQpuiq8M'],5:['equivalentes','Frações equivalentes','hTGFQpuiq8M'],6:['soma-fracoes','Adição de frações com denominadores diferentes','hTGFQpuiq8M'],7:['soma-fracoes','Subtração de frações com denominadores diferentes','hTGFQpuiq8M'],8:['mult-fracoes','Multiplicação de frações','hTGFQpuiq8M'],9:['mult-fracoes','Divisão de frações','hTGFQpuiq8M'],10:['interpretacao','Problemas com frações','hTGFQpuiq8M'],11:['decimais','Números decimais','mvovwg11wCw'],12:['decimais','Fração decimal','mvovwg11wCw'],13:['decimais','Comparação de decimais','mvovwg11wCw'],14:['operacoes-decimais','Adição de decimais','mvovwg11wCw'],15:['operacoes-decimais','Subtração de decimais','mvovwg11wCw'],16:['decimais','Ordem de números decimais','mvovwg11wCw'],17:['operacoes-decimais','Multiplicação de decimais','mvovwg11wCw'],18:['operacoes-decimais','Divisão de decimais','mvovwg11wCw'],19:['interpretacao','Problemas com divisão decimal','mvovwg11wCw'],20:['interpretacao','Problemas com dinheiro e decimais','mvovwg11wCw']};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadReport(){try{return JSON.parse(localStorage.getItem(CORR_KEY)||'null')}catch(e){return null}}
function saveReport(x){localStorage.setItem(CORR_KEY,JSON.stringify(Object.assign({},x,{savedAt:new Date().toISOString()})))}
function loadGrades(){try{return JSON.parse(localStorage.getItem(GRADE_KEY)||'{"blocks":{}}')}catch(e){return {blocks:{}}}}
function getWindows(){try{const hub=shell.contentWindow,hubDoc=shell.contentDocument;if(!hubDoc)return null;const pubFrame=hubDoc.getElementById('shell');if(!pubFrame)return null;const pub=pubFrame.contentWindow,pubDoc=pubFrame.contentDocument;if(!pubDoc)return null;const appFrame=pubDoc.getElementById('app');if(!appFrame)return null;const app=appFrame.contentWindow,doc=appFrame.contentDocument;if(!doc)return null;return{hub,hubDoc,pub,pubDoc,app,doc}}catch(e){return null}}
function installStyles(doc){if(doc.getElementById('corrV3Css'))return;const s=doc.createElement('style');s.id='corrV3Css';s.textContent=`
.q-v4.correct-ok{border-color:#81c784;background:#f7fff8}.q-v4.correct-no{border-color:#ef9a9a;background:#fffafa}.corr-q-v3{margin-top:12px;border-radius:15px;padding:13px 14px;border:1px solid #dbe4ee;background:#fff}.corr-q-v3.ok{background:#edf9ef;border-color:#b9dfbd}.corr-q-v3.no{background:#fff3f3;border-color:#f2b8b5}.corr-head-v3{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.corr-badge-v3{font-weight:900;font-size:13px}.corr-score-v3{font-size:12px;font-weight:900;color:#475569}.corr-q-v3 p{margin:8px 0 0;line-height:1.5}.corr-actions-v3{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.corr-actions-v3 a{display:inline-block;text-decoration:none;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900}.study-v3{background:#2E7D32;color:#fff}.video-v3{background:#e3f2fd;color:#0d47a1}.report-v3{margin-top:18px;border:1px solid #dfe7e1;border-radius:22px;padding:20px;background:#fff;box-shadow:0 8px 24px rgba(16,24,40,.07)}.report-v3 h3{margin:0 0 8px}.report-grid-v3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.report-stat-v3{padding:14px;border-radius:15px;background:#f8fafc;border:1px solid #e2e8f0}.report-stat-v3 strong{font-size:26px;display:block}.module-list-v3{display:grid;gap:7px;margin:10px 0}.module-row-v3{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-radius:11px;background:#f8fafc}.review-card-v3{padding:12px 14px;border-radius:14px;background:#fff8e1;border:1px solid #ffe0a3;margin:8px 0}.practice-v3{padding:12px 14px;border-radius:14px;background:#f5fbff;border:1px dashed #90caf9;margin:8px 0}.pending-v3{color:#7c4a03}.oktext-v3{color:#225b25}.badtext-v3{color:#9b1c1c}@media(max-width:700px){.report-grid-v3{grid-template-columns:1fr}.module-row-v3{font-size:13px}}
`;doc.head.appendChild(s)}
function normalizePQ(report){const arr=Array.isArray(report?.per_question)?report.per_question:[];const by={};for(const x of arr){const n=Number(x.numero||x.question||x.n);if(n>=1&&n<=20)by[n]=x}return by}
function renderPerQuestion(env,report){const {doc}=env,root=doc.querySelector('#examRootV4');if(!root||!report)return;installStyles(doc);const by=normalizePQ(report),cards=[...root.querySelectorAll('.q-v4')];cards.forEach((card,i)=>{const n=i+1,x=by[n];card.querySelector('.corr-q-v3')?.remove();card.classList.remove('correct-ok','correct-no');if(!x)return;const ok=x.correta===true||String(x.correta).toLowerCase()==='true',topic=TOPIC_MAP[n]||TOPIC_MAP[n<=10?1:11],pts=x.pontos_obtidos??'',mx=x.pontos_maximos??'',obs=x.explicacao||x.erro||x.observacao||(ok?'Resposta correta.':'Revise este conteúdo.'),div=doc.createElement('div');div.className='corr-q-v3 '+(ok?'ok':'no');card.classList.add(ok?'correct-ok':'correct-no');const study='/estudar/?topic='+encodeURIComponent(topic[0]);const video='https://www.youtube.com/watch?v='+topic[2];div.innerHTML=`<div class="corr-head-v3"><span class="corr-badge-v3 ${ok?'oktext-v3':'badtext-v3'}">${ok?'✓ Acertou':'✕ Precisa corrigir'}</span><span class="corr-score-v3">${esc(pts)} / ${esc(mx)} pt</span></div><p>${esc(obs)}</p>${ok?'':`<div class="corr-actions-v3"><a class="study-v3" href="${study}" target="_blank" rel="noopener">Estudar ${esc(topic[1])}</a><a class="video-v3" href="${video}" target="_blank" rel="noopener">Vídeo de apoio</a></div>`}`;card.appendChild(div)})}
function avgBlocks(g){const vals=[];for(let i=1;i<=11;i++){const v=Number(g?.blocks?.[String(i)]);if(Number.isFinite(v))vals.push(v)}return{count:vals.length,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}}
function renderReport(env,report){const {doc}=env,root=doc.querySelector('#examRootV4');if(!root||!report)return;installStyles(doc);root.querySelector('.report-v3')?.remove();const g=loadGrades(),b=avgBlocks(g),exam=Number(report.score??g.exam),examOk=Number.isFinite(exam),overall=examOk&&b.count===11?(exam+b.avg)/2:null,pq=normalizePQ(report),correct=Object.values(pq).filter(x=>x.correta===true||String(x.correta).toLowerCase()==='true').map(x=>Number(x.numero)).sort((a,b)=>a-b),wrong=Object.values(pq).filter(x=>x.correta===false||String(x.correta).toLowerCase()==='false').map(x=>Number(x.numero)).sort((a,b)=>a-b),box=doc.createElement('div');box.className='report-v3';const modules=MODULES.map((name,i)=>{const v=Number(g?.blocks?.[String(i+1)]);return `<div class="module-row-v3"><span>${i+1}. ${esc(name)}</span><strong>${Number.isFinite(v)?v.toFixed(1).replace('.',','):'Aguardando correção'}</strong></div>`}).join('');const needs=(report.needs_review||[]).map(x=>`<div class="review-card-v3">${esc(typeof x==='string'?x:(x.topico||x.topic||JSON.stringify(x)))}</div>`).join('');const practice=(report.remedial_exercises||[]).map((x,i)=>`<div class="practice-v3"><strong>Treino ${i+1}</strong><br>${esc(typeof x==='string'?x:(x.exercicio||x.prompt||''))}${(x.objetivo||x.why)?`<br><small>${esc(x.objetivo||x.why)}</small>`:''}</div>`).join('');box.innerHTML=`<h3>Resultado da avaliação</h3><p>${esc(report.raw_summary||report.summary||'Correção concluída pelo Professor.')}</p><div class="report-grid-v3"><div class="report-stat-v3"><span>Nota da prova</span><strong>${examOk?exam.toFixed(1).replace('.',','):'—'}</strong><small>de 10,0</small></div><div class="report-stat-v3"><span>Média dos módulos</span><strong>${b.avg!==null?b.avg.toFixed(1).replace('.',','):'—'}</strong><small>${b.count}/11 corrigidos</small></div><div class="report-stat-v3"><span>Média geral</span><strong>${overall!==null?overall.toFixed(1).replace('.',','):'—'}</strong><small>${overall!==null?'50% módulos + 50% prova':'aguardando todas as notas'}</small></div></div><p><strong>Questões acertadas:</strong> ${correct.length?correct.join(', '):'—'}</p><p><strong>Questões para corrigir:</strong> ${wrong.length?wrong.join(', '):'nenhuma'}</p><h4>Notas dos módulos</h4><div class="module-list-v3">${modules}</div><h4>O que estudar agora</h4>${needs||'<p>Nenhuma revisão específica foi indicada.</p>'}<h4>Exercícios de reforço</h4>${practice||'<p>O Professor ainda não gerou exercícios de reforço.</p>'}<div class="${overall===null?'pending-v3':overall>=6?'oktext-v3':'badtext-v3'}" style="margin-top:14px;font-weight:900">${overall===null?'A média geral será fechada quando os 11 módulos e a prova estiverem corrigidos.':overall>=6?'Meta do simulado atingida. Continue revisando os pontos indicados.':'A média ainda está abaixo de 6,0. Priorize as revisões acima antes de um novo simulado.'}</div>`;const host=root.querySelector('.photo-stop')?.parentElement||root;host.appendChild(box)}
function renderAll(){const env=getWindows(),report=loadReport();if(!env||!report)return;renderPerQuestion(env,report);renderReport(env,report)}
function installHook(){const env=getWindows();if(!env)return false;const {hub}=env;if(hub.__corrHookV3)return true;const original=hub.callAI;if(typeof original!=='function')return false;hub.callAI=async function(payload){const data=await original(payload);if(payload?.mode==='correct_exam'&&data){saveReport(data);setTimeout(renderAll,50)}return data};hub.__corrHookV3=true;return true}
setInterval(()=>{installHook();renderAll()},700);
shell.addEventListener('load',()=>setTimeout(()=>{installHook();renderAll()},500));
</script></body></html>
