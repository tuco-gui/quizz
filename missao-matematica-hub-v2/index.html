<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Missão Matemática</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf8}#shell{display:block;width:100%;height:100dvh;border:0}</style></head>
<body>
<iframe id="shell" src="/missao-matematica-publica-v2/index.html" title="Missão Matemática"></iframe>
<script>
const shell=document.getElementById('shell');
const DB_NAME='missao-matematica-files-v1', GRADE_KEY='missao-matematica-grades-v1', PASSING_GRADE=6;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getPhoto(key){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function putPhoto(obj){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function delPhoto(key){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function profile(){try{return JSON.parse(localStorage.getItem('missao-matematica-student-v1')||'null')}catch(e){return null}}
function grades(){try{return JSON.parse(localStorage.getItem(GRADE_KEY)||'{"blocks":{}}')}catch(e){return {blocks:{}}}}
function saveGrades(g){g.updatedAt=new Date().toISOString();localStorage.setItem(GRADE_KEY,JSON.stringify(g))}
function blobToDataURL(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{try{const max=1600,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.76))}catch(e){rej(e)}};im.onerror=e=>{URL.revokeObjectURL(u);rej(e)};im.src=u})}
async function callAI(payload){const r=await fetch('/api/professor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||data.message||('Erro '+r.status));return data}
function attach(){
 const pub=shell.contentDocument;if(!pub)return;const app=pub.getElementById('app');if(!app)return;
 const install=()=>{
  const w=app.contentWindow,d=app.contentDocument;if(!d||!d.body)return;
  if(!d.getElementById('hubCssV2')){const s=d.createElement('style');s.id='hubCssV2';s.textContent=`
  .hub-photo{margin-top:16px}.hub-drop{border:2px dashed #64b5f6;border-radius:18px;padding:20px;background:#f7fbff;text-align:center;cursor:pointer}.hub-drop.drag{background:#e3f2fd;border-color:#1565c0}.hub-preview{display:none;margin-top:12px;border:1px solid #dbe4ee;border-radius:16px;padding:10px;background:#fff}.hub-preview.show{display:block}.hub-preview img{display:block;max-width:100%;max-height:420px;margin:auto;border-radius:12px;object-fit:contain;background:#f8fafc}.hub-meta{font-size:12px;color:#64748b;margin-top:8px}.hub-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hub-actions button,.hub-mainbtn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.hub-save{background:#1565c0;color:#fff}.hub-correct{background:#2E7D32;color:#fff}.hub-replace{background:#eef7f0;color:#2E7D32}.hub-remove{background:#fff0f0;color:#b91c1c}.hub-state{margin-top:9px;padding:10px 12px;border-radius:12px;background:#f8fafc;font-size:13px}.hub-state.ok{background:#e8f5e9;color:#225b25}.hub-state.wait{background:#fff8e1;color:#7c4a03}.exam-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.exam-photo-card{border:1px solid #dbe4ee;border-radius:14px;padding:8px}.exam-photo-card img{width:100%;height:170px;object-fit:contain;border-radius:10px;background:#f8fafc}.prof-nav,.result-nav-hub{border-top:1px solid #e5e7eb!important;margin-top:7px!important;padding-top:12px!important}.prof-card,.result-card-hub{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 28px rgba(16,24,40,.08)}.prof-chat{display:grid;gap:10px;max-height:48vh;overflow:auto;margin:14px 0}.bubble{padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap}.bubble.me{background:#e3f2fd;margin-left:12%}.bubble.ai{background:#eef7f0;margin-right:12%}.prof-row{display:flex;gap:8px}.prof-row textarea{flex:1;min-height:64px;border:1px solid #cbd5e1;border-radius:14px;padding:11px}.prof-row button{border:0;border-radius:14px;padding:10px 14px;font-weight:900}.prof-send{background:#2E7D32;color:#fff}.prof-mic{background:#fff3e0;color:#a64b00}.result-grid-hub{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result-box-hub{padding:14px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0}.result-box-hub strong{display:block;font-size:28px}.status-hub{padding:16px;border-radius:16px;font-weight:900;margin-top:14px}.status-hub.ok{background:#e8f5e9;color:#225b25}.status-hub.wait{background:#fff8e1;color:#7c4a03}.status-hub.no{background:#ffebee;color:#8b1e1e}@media(max-width:700px){.exam-photo-grid,.result-grid-hub{grid-template-columns:1fr}.prof-row{display:grid}}
  `;d.head.appendChild(s)}
  const getState=()=>{try{return w.eval('state')}catch(e){return null}}, getLessons=()=>{try{return w.eval('lessons')}catch(e){return []}};
  async function addBlockPhoto(){
    const st=getState(),less=getLessons();if(!st||st.current>=less.length)return;const stop=d.querySelector('.lesson.active .photo-stop');if(!stop||stop.querySelector('.hub-photo'))return;
    const block=st.current+1,key='block-'+block,wrap=d.createElement('div');wrap.className='hub-photo';
    wrap.innerHTML=`<div class="hub-drop" tabindex="0"><div style="font-size:30px">📷</div><strong>Anexar 1 foto com todas as respostas deste bloco</strong><br><small>Clique ou arraste a imagem.</small><input type="file" accept="image/*" hidden></div><div class="hub-preview"><img><div class="hub-meta"></div><div class="hub-actions"><button class="hub-save">Salvar foto</button><button class="hub-correct">Corrigir este bloco</button><button class="hub-replace">Trocar</button><button class="hub-remove">Remover</button></div><div class="hub-state wait">Aguardando salvamento.</div></div>`;
    stop.appendChild(wrap);const drop=wrap.querySelector('.hub-drop'),input=wrap.querySelector('input'),preview=wrap.querySelector('.hub-preview'),img=wrap.querySelector('img'),meta=wrap.querySelector('.hub-meta'),stateBox=wrap.querySelector('.hub-state');
    async function refresh(){const it=await getPhoto(key);if(it?.blob){img.src=URL.createObjectURL(it.blob);meta.textContent=(it.name||'Foto do bloco')+' • '+new Date(it.updatedAt).toLocaleString('pt-BR');preview.classList.add('show');drop.style.display='none';stateBox.className='hub-state '+(it.saved?'ok':'wait');stateBox.textContent=it.saved?'Salva neste aparelho ✓':'Foto anexada. Toque em “Salvar foto”.'}else{preview.classList.remove('show');drop.style.display='block'}}
    async function select(file){if(!file?.type.startsWith('image/'))return w.alert('Selecione uma imagem.');const p=profile();await putPhoto({key,block,blob:file,name:file.name||('bloco-'+block+'.jpg'),type:file.type,size:file.size,student:p?.name||'',saved:false,updatedAt:new Date().toISOString()});await refresh()}
    drop.onclick=()=>input.click();input.onchange=()=>{if(input.files[0])select(input.files[0]);input.value=''};['dragover','dragenter'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])select(e.dataTransfer.files[0])});
    wrap.querySelector('.hub-save').onclick=async()=>{const it=await getPhoto(key);if(!it)return;it.saved=true;it.savedAt=new Date().toISOString();await putPhoto(it);await refresh()};
    wrap.querySelector('.hub-replace').onclick=()=>input.click();wrap.querySelector('.hub-remove').onclick=async()=>{if(w.confirm('Remover esta foto?')){await delPhoto(key);await refresh()}};
    wrap.querySelector('.hub-correct').onclick=async e=>{const btn=e.currentTarget,it=await getPhoto(key);if(!it)return w.alert('Anexe a foto primeiro.');if(!it.saved)return w.alert('Toque em “Salvar foto” antes de corrigir.');btn.disabled=true;stateBox.className='hub-state wait';stateBox.textContent='Professor corrigindo…';try{const answers=JSON.parse(localStorage.getItem('missao-matematica-study-answers-v1')||'{}');const blockAnswers=Object.fromEntries(Object.entries(answers).filter(([k])=>k.startsWith('b'+block+'q')));const data=await callAI({mode:'correct_block',student:profile()?.name||'',block,answers:blockAnswers,image:await blobToDataURL(it.blob)});stateBox.className='hub-state ok';stateBox.textContent='Correção: '+(data.feedback||data.message||'concluída');if(Number.isFinite(Number(data.score))){const g=grades();g.blocks=g.blocks||{};g.blocks[String(block)]=Number(data.score);saveGrades(g)}}catch(err){stateBox.className='hub-state wait';stateBox.textContent='Não foi possível corrigir: '+err.message}finally{btn.disabled=false}};
    await refresh();
  }
  async function addExamPhotos(){
    const root=d.querySelector('#examRootV4');if(!root)return;const stop=root.querySelector('.photo-stop');if(!stop||stop.querySelector('.exam-photo-hub'))return;
    const box=d.createElement('div');box.className='exam-photo-hub hub-photo';box.innerHTML=`<div class="hub-drop"><div style="font-size:30px">📸</div><strong>Anexe até 4 fotos das contas da avaliação</strong><br><small>Clique ou arraste as imagens.</small><input type="file" accept="image/*" multiple hidden></div><div class="exam-photo-grid"></div><div class="hub-actions"><button class="hub-save">Salvar fotos da avaliação</button><button class="hub-correct">Corrigir avaliação</button></div><div class="hub-state wait">Aguardando fotos.</div>`;
    stop.insertBefore(box,stop.firstChild);const drop=box.querySelector('.hub-drop'),input=box.querySelector('input'),grid=box.querySelector('.exam-photo-grid'),stateBox=box.querySelector('.hub-state');
    async function items(){const a=[];for(let i=1;i<=4;i++){const x=await getPhoto('exam-'+i);if(x)a.push(x)}return a}
    async function refresh(){grid.innerHTML='';const a=await items();for(const it of a){const c=d.createElement('div');c.className='exam-photo-card';c.innerHTML=`<img><div class="hub-meta">${it.name||it.key}</div>`;c.querySelector('img').src=URL.createObjectURL(it.blob);grid.appendChild(c)}stateBox.className='hub-state '+(a.length&&a.every(x=>x.saved)?'ok':'wait');stateBox.textContent=!a.length?'Aguardando fotos.':a.every(x=>x.saved)?'Fotos salvas neste aparelho ✓':'Fotos anexadas. Toque em “Salvar fotos da avaliação”.'}
    async function select(fs){let a=await items(),slots=[1,2,3,4].filter(i=>!a.some(x=>x.key==='exam-'+i));for(const f of [...fs].filter(x=>x.type.startsWith('image/')).slice(0,slots.length)){const i=slots.shift(),p=profile();await putPhoto({key:'exam-'+i,exam:true,blob:f,name:f.name||('avaliacao-'+i+'.jpg'),type:f.type,size:f.size,student:p?.name||'',saved:false,updatedAt:new Date().toISOString()})}await refresh()}
    drop.onclick=()=>input.click();input.onchange=()=>{select(input.files);input.value=''};drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();select(e.dataTransfer.files)});
    box.querySelector('.hub-save').onclick=async()=>{for(const it of await items()){it.saved=true;it.savedAt=new Date().toISOString();await putPhoto(it)}await refresh()};
    box.querySelector('.hub-correct').onclick=async e=>{const btn=e.currentTarget,a=await items();if(!a.length)return w.alert('Anexe as fotos primeiro.');if(!a.every(x=>x.saved))return w.alert('Salve as fotos antes de corrigir.');btn.disabled=true;stateBox.className='hub-state wait';stateBox.textContent='Professor corrigindo a avaliação…';try{const answers=JSON.parse(localStorage.getItem('missao-matematica-exam-v1')||'{}');const images=[];for(const it of a)images.push(await blobToDataURL(it.blob));const data=await callAI({mode:'correct_exam',student:profile()?.name||'',answers,images});stateBox.className='hub-state ok';stateBox.textContent='Correção: '+(data.feedback||data.message||'concluída');if(Number.isFinite(Number(data.score))){const g=grades();g.exam=Number(data.score);saveGrades(g)}}catch(err){stateBox.className='hub-state wait';stateBox.textContent='Não foi possível corrigir: '+err.message}finally{btn.disabled=false}};
    await refresh();
  }
  function addProfessorNav(){const nav=d.getElementById('navList');if(!nav||nav.querySelector('.prof-nav'))return;const b=d.createElement('button');b.className='nav-item prof-nav';b.innerHTML='<span class="dot">👨‍🏫</span><span class="nav-text">Professor</span>';b.onclick=showProfessor;nav.appendChild(b)}
  function showProfessor(){const main=d.getElementById('main');main.innerHTML=`<div class="prof-card"><span class="section-kicker">Professor</span><h2>Tire sua dúvida</h2><p>Escreva ou toque no microfone. O professor vai dar pistas antes de entregar a resposta.</p><div class="prof-chat" id="profChat"></div><div class="prof-row"><textarea id="profText" placeholder="Ex.: Não entendi por que 3/2 fica depois do 1."></textarea><button class="prof-mic" id="profMic">🎤</button><button class="prof-send" id="profSend">Enviar</button></div></div>`;const chat=d.getElementById('profChat'),ta=d.getElementById('profText');
    const add=(txt,who)=>{const x=d.createElement('div');x.className='bubble '+who;x.textContent=txt;chat.appendChild(x);chat.scrollTop=chat.scrollHeight};
    d.getElementById('profSend').onclick=async()=>{const q=ta.value.trim();if(!q)return;add(q,'me');ta.value='';try{const st=getState(),less=getLessons(),context=st&&st.current<less.length?{block:st.current+1,title:less[st.current].title}:{};const r=await callAI({mode:'chat',student:profile()?.name||'',question:q,context});add(r.message||r.feedback||'Resposta recebida.','ai')}catch(e){add('Não consegui falar com o professor agora: '+e.message,'ai')}};
    d.getElementById('profMic').onclick=()=>{const SR=w.SpeechRecognition||w.webkitSpeechRecognition;if(!SR)return w.alert('O reconhecimento de voz não está disponível neste navegador.');const r=new SR();r.lang='pt-BR';r.interimResults=false;r.onresult=e=>{ta.value=e.results[0][0].transcript};r.onerror=()=>w.alert('Não consegui ouvir. Tente novamente.');r.start()};
  }
  function addResultNav(){const nav=d.getElementById('navList');if(!nav||nav.querySelector('.result-nav-hub'))return;const b=d.createElement('button');b.className='nav-item result-nav-hub';b.innerHTML='<span class="dot">📊</span><span class="nav-text">Resultado Geral</span>';b.onclick=showResult;nav.appendChild(b)}
  function showResult(){const main=d.getElementById('main'),g=grades(),blocks=g.blocks||{},vals=[];for(let i=1;i<=11;i++){const v=Number(blocks[String(i)]);if(Number.isFinite(v))vals.push(v)}const study=vals.length===11?vals.reduce((a,b)=>a+b,0)/11:null,exam=Number.isFinite(Number(g.exam))?Number(g.exam):null,overall=study!==null&&exam!==null?(study+exam)/2:null;let status='<div class="status-hub wait">Aguardando correção.</div>';if(overall!==null)status=overall>=PASSING_GRADE?'<div class="status-hub ok">APROVADA no simulado • média '+overall.toFixed(1).replace('.',',')+'</div>':'<div class="status-hub no">AINDA NÃO ATINGIU A MÉDIA • '+overall.toFixed(1).replace('.',',')+'</div>';main.innerHTML=`<div class="result-card-hub"><span class="section-kicker">Resultado Geral</span><h2>Desempenho de ${profile()?.name||'estudante'}</h2><div class="result-grid-hub"><div class="result-box-hub">Blocos corrigidos<strong>${vals.length}/11</strong></div><div class="result-box-hub">Média dos estudos<strong>${study===null?'—':study.toFixed(1).replace('.',',')}</strong></div><div class="result-box-hub">Avaliação final<strong>${exam===null?'—':exam.toFixed(1).replace('.',',')}</strong></div></div>${status}<p>Fórmula: 50% média dos blocos + 50% avaliação final. Média mínima do simulado: 6,0.</p></div>`}
  let lock=false;const patch=()=>{if(lock)return;lock=true;setTimeout(async()=>{try{await addBlockPhoto();await addExamPhotos();addProfessorNav();addResultNav()}finally{lock=false}},80)};new MutationObserver(patch).observe(d.body,{childList:true,subtree:true});patch();
 };
 if(app.contentDocument?.readyState==='complete')install();else app.addEventListener('load',install,{once:true})
}
shell.addEventListener('load',attach);
</script></body></html>
