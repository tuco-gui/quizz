<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Missão Matemática</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf8}#app{width:100%;height:100dvh;border:0;display:block}</style></head><body><iframe id="app" src="/missao-matematica-central/index.html" title="Missão Matemática"></iframe><script>
const F=document.getElementById('app');
const PED={
'naturais':{scene:['Tenho 4 582 figurinhas. O 4 vale só quatro?','Não. A posição muda o valor do algarismo.','4 milhares, 5 centenas, 8 dezenas e 2 unidades.'],steps:['Leia o número da esquerda para a direita.','Separe cada algarismo pela posição que ocupa.','Faça uma estimativa antes da conta.'],mist:'Esquecer o valor posicional. Em 4 582, o 4 vale 4 000.',check:'No número 7 305, quanto vale o algarismo 3?'},
'divisibilidade':{scene:['Tenho 24 peças. Dá para fazer grupos de 6?','Sim: 24 ÷ 6 = 4 e não sobra nada.','Então 6 é divisor de 24.'],steps:['Veja se a divisão deixa resto.','Se não deixa resto, é divisor.','Para primo, procure apenas dois divisores: 1 e ele mesmo.'],mist:'Confundir divisor com múltiplo. Divisor cabe exatamente; múltiplo aparece na tabuada.',check:'5 é divisor de 35? Explique com uma divisão.'},
'fracoes':{scene:['Dividi uma pizza em 4 pedaços iguais.','Comi 3. Quantos pedaços do total eu comi?','Três de quatro: 3/4.'],steps:['Confirme que as partes são iguais.','Conte o total de partes: denominador.','Conte as partes escolhidas: numerador.','Para fração de quantidade, divida pelo denominador e multiplique pelo numerador.'],mist:'Usar partes de tamanhos diferentes ou inverter numerador e denominador.',check:'Uma barra tem 8 partes iguais e 5 estão pintadas. Qual é a fração pintada?',video:'hTGFQpuiq8M'},
'reta-fracoes':{scene:['Quero marcar 3/2. Mas 3 é maior que 2!','O 2 manda dividir cada unidade em duas partes iguais.','Conte três meios desde o zero: 1/2, 2/2, 3/2.'],steps:['Marque 0, 1, 2...','Use o denominador para dividir cada unidade em partes iguais.','Conte a partir do zero tantos passos quanto o numerador.','Se passar de 1, continue na unidade seguinte.'],mist:'Contar as marcas em vez dos intervalos ou fazer intervalos de tamanhos diferentes.',check:'Onde fica 5/4? Antes ou depois de 1? Explique.',video:'hTGFQpuiq8M'},
'equivalentes':{scene:['Metade da barra é 1/2.','Dividi cada metade de novo: agora são 2 partes de 4.','A quantidade continua igual: 1/2 = 2/4.'],steps:['Escolha um número para multiplicar ou dividir.','Faça a mesma operação em cima e embaixo.','Para comparar, use denominadores iguais quando ajudar.'],mist:'Mudar só o numerador ou só o denominador.',check:'Complete: 3/5 = ?/10.'},
'soma-fracoes':{scene:['Tenho 1/2 e mais 1/3.','Metades e terços têm tamanhos diferentes.','Transforme em sextos: 3/6 + 2/6 = 5/6.'],steps:['Veja se os denominadores são iguais.','Se não, encontre um denominador comum.','Crie frações equivalentes.','Some ou subtraia os numeradores.'],mist:'Somar os denominadores. As partes continuam do mesmo tamanho.',check:'Por que 1/2 + 1/4 não é 2/6?'},
'mult-fracoes':{scene:['Quero metade de 3/4 de uma receita.','“Metade de” significa multiplicar por 1/2.','Então faço 1/2 × 3/4.'],steps:['Na multiplicação, multiplique cima com cima e baixo com baixo.','Simplifique quando puder.','Na divisão, conserve a primeira e multiplique pelo inverso da segunda.'],mist:'Na divisão, inverter as duas frações. Inverta somente a segunda.',check:'Em 3/4 ÷ 2/5, qual fração deve ser invertida?'},
'decimais':{scene:['Um preço é R$ 4,08 e outro R$ 4,80. Qual é maior?','A parte inteira é 4 nos dois. Compare os décimos.','4,80 tem 8 décimos; 4,08 tem 0 décimos.'],steps:['Compare a parte inteira.','Se empatar, compare décimos.','Depois centésimos e milésimos.','Complete zeros à direita se ajudar: 3,5 = 3,50.'],mist:'Olhar apenas a quantidade de algarismos depois da vírgula.',check:'Qual é maior: 2,7 ou 2,65? Explique.',video:'mvovwg11wCw'},
'operacoes-decimais':{scene:['Tenho R$ 10,00 e gasto R$ 3,75.','Alinho vírgula com vírgula.','Depois faço 10,00 − 3,75.'],steps:['Soma/subtração: alinhe as vírgulas.','Complete zeros se precisar.','Multiplicação: conte as casas decimais.','Divisão por decimal: transforme o divisor em natural.'],mist:'Alinhar os últimos algarismos em vez das vírgulas.',check:'Como você escreveria 2,5 para somar com 0,37?'},
'porcentagem':{scene:['Uma camiseta tem 25% de desconto.','25% significa 25 em cada 100.','25/100 = 1/4. Posso achar a quarta parte.'],steps:['Leia % como “por cento”.','Escreva como fração de 100.','Use relações conhecidas: 50%=1/2, 25%=1/4, 10%=1/10.'],mist:'Tratar 25% como 25 vezes o número.',check:'50% de 30 é quanto? Explique pela ideia de metade.'},
'geometria':{scene:['Quero achar o ponto (3,2).','Primeiro ando 3 no eixo horizontal.','Depois subo 2 no eixo vertical.'],steps:['Observe a figura.','Nomeie lados, vértices, ângulos ou eixos.','No plano cartesiano, horizontal primeiro, vertical depois.'],mist:'Trocar a ordem das coordenadas.',check:'No ponto (2,5), qual movimento vem primeiro?'},
'medidas':{scene:['A mesa mede 5 m por 3 m. Quero saber a volta toda.','“Volta toda” indica perímetro.','Somamos 5+3+5+3. Área seria outra pergunta.'],steps:['Descubra qual grandeza foi pedida.','Confira as unidades.','Converta se forem diferentes.','Escolha a operação adequada.'],mist:'Confundir perímetro com área.',check:'Para saber quantos pisos cobrem o chão, procuro perímetro ou área?'},
'probabilidade':{scene:['Vou lançar um dado. Qual a chance de sair par?','Resultados possíveis: 1,2,3,4,5,6.','Favoráveis: 2,4,6. São 3 de 6.'],steps:['Liste os resultados possíveis.','Conte os favoráveis.','Monte favoráveis/possíveis.'],mist:'Contar só os favoráveis e esquecer o total.',check:'Num dado, qual é a probabilidade de sair 1?'},
'estatistica':{scene:['A barra chegou na terceira linha. Então vale 3?','Só se a escala for de 1 em 1.','Se cada linha vale 5, a terceira representa 15.'],steps:['Leia o título.','Leia eixos e unidades.','Descubra a escala.','Só depois compare e responda.'],mist:'Ignorar a escala do gráfico.',check:'Se a escala aumenta de 10 em 10, o que representa a quarta marca?'},
'interpretacao':{scene:['Li o problema e já quero fazer a conta.','Primeiro descubra o que foi dado e o que a pergunta quer.','Depois escolha a operação e confira se a resposta faz sentido.'],steps:['Circule números e unidades.','Sublinhe a pergunta.','Escreva DADOS, PERGUNTA e OPERAÇÃO.','Faça a conta e responda com unidade.'],mist:'Escolher a operação só por uma palavra isolada.',check:'Explique com suas palavras: o que a questão está pedindo?'}
};
const CSS=`.story-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.story-panel{background:#fffdf6;border:2px solid #1f2937;border-radius:16px;padding:14px;min-height:150px;box-shadow:3px 3px 0 #1f2937}.story-person{font-size:40px;margin-bottom:8px}.speech{background:#fff;border:1.5px solid #334155;border-radius:14px;padding:10px;font-size:13px;line-height:1.45}.micro-steps{display:grid;gap:10px}.micro-step{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}.micro-step .n{width:34px;height:34px;border-radius:11px;background:#2E7D32;color:#fff;display:grid;place-items:center;font-weight:900}.micro-step strong{display:block}.mini-check{padding:16px;border:2px dashed #90caf9;border-radius:16px;background:#f5fbff}.mistake{padding:14px 16px;border-radius:15px;background:#ffebee;border:1px solid #ffcdd2}.visual-stage{padding:16px;background:#fbfefc;border:1px solid #dfe7e1;border-radius:18px;margin:14px 0}.pie{width:92px;height:92px;border-radius:50%;background:conic-gradient(#81c784 0 75%,#fff 75% 100%);border:2px solid #334155}.video-card{border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;background:#000}.video-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0}.video-guide{padding:12px 14px;background:#fff;color:#334155;font-size:13px;line-height:1.45}.source-badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef7f0;color:#2E7D32;font-size:11px;font-weight:900;margin:3px}.attention-note{padding:13px 15px;border-radius:15px;background:#fff8e1;border:1px solid #ffe0a3;margin:12px 0}.topic-lead{font-size:17px!important;color:#475569}@media(max-width:700px){.story-strip{grid-template-columns:1fr}.story-panel{min-height:0}}`;
function install(){const w=F.contentWindow,d=F.contentDocument;if(!d||!d.body)return;const s=d.createElement('style');s.textContent=CSS;d.head.appendChild(s);let topics;try{topics=w.eval('TOPICS')}catch(e){return}const oldShow=w.eval('showTopic');w.eval(`window.__PED=${JSON.stringify(PED)};window.__enhancedShow=function(id){const t=TOPICS.find(x=>x.id===id);if(!t)return;const p=window.__PED[id]||window.__PED.interpretacao;home.classList.add('hidden');page.classList.add('show');document.getElementById('studyHeader').textContent=t.title;const story='<div class="story-strip">'+p.scene.map((x,i)=>'<div class="story-panel"><div class="story-person">'+(i===0?'👧🏻':i===1?'🧑🏻‍🏫':'💡')+'</div><div class="speech">'+x+'</div></div>').join('')+'</div>';const steps='<div class="micro-steps">'+p.steps.map((x,i)=>'<div class="micro-step"><div class="n">'+(i+1)+'</div><div><strong>'+(['Observe','Organize','Faça','Confira'][i]||'Passo')+'</strong>'+x+'</div></div>').join('')+'</div>';let visual=visualFor(t);if(t.id==='fracoes')visual='<div class="visual-stage"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="pie"></div><div><strong>3/4</strong><br>3 partes escolhidas de 4 partes iguais.</div></div>'+visual+'</div>';const video=p.video?'<div class="video-card"><iframe src="https://www.youtube-nocookie.com/embed/'+p.video+'?rel=0&modestbranding=1&cc_load_policy=1&cc_lang_pref=pt" allowfullscreen></iframe><div class="video-guide"><strong>Antes de assistir:</strong> observe a representação visual.<br><strong>Depois:</strong> responda “qual foi o primeiro passo e por quê?”</div></div>':'<p>Ainda não há vídeo incorporado para este tema. Use os recursos confiáveis abaixo se precisar de outra explicação.</p>';page.innerHTML='<div class="lesson-card"><div style="font-size:34px">'+t.icon+'</div><h2>'+t.title+'</h2><p class="topic-lead">'+t.desc+'</p><span class="source-badge">Bernoulli: aprendizagem em espiral</span><span class="source-badge">6º ano</span><div class="source-note">Explicação original, construída para acompanhar a sequência escolar sem copiar páginas do livro.</div></div><div class="lesson-card"><h3>1. Comece por uma situação simples</h3><p>Antes da regra, entenda a ideia numa situação concreta.</p>'+story+'</div><div class="lesson-card"><h3>2. Veja a matemática por trás</h3><p>'+t.explain+'</p>'+visual+'<div class="keybox"><strong>Guarde esta ideia</strong><br>'+t.key+'</div></div><div class="lesson-card"><h3>3. Faça em passos pequenos</h3>'+steps+'<div class="attention-note"><strong>Sem pressa.</strong> Leia um passo, faça só esse passo e depois continue.</div></div><div class="lesson-card"><h3>4. Exemplo resolvido e explicado</h3><p>'+t.example+'</p><div class="warnbox"><strong>Explique com suas palavras:</strong> o que foi feito primeiro e por quê?</div></div><div class="lesson-card"><h3>5. Erro comum</h3><div class="mistake"><strong>Cuidado:</strong> '+p.mist+'</div></div><div class="lesson-card"><h3>6. Teste rápido</h3><div class="mini-check"><strong>Sem olhar a resposta:</strong><br>'+p.check+'</div></div><div class="lesson-card"><h3>7. Aula em vídeo, sem sair da página</h3>'+video+'<div class="resource-row">'+t.links.filter(l=>l[2]!=='video').map(l=>'<a class="resource" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>').join('')+'</div><div class="source-note">Fontes complementares: Khan Academy Brasil, Portal da Matemática OBMEP/IMPA, BNCC e GeoGebra.</div></div>';study.scrollTo({top:0})};showTopic=window.__enhancedShow;renderGrid();`);}
F.addEventListener('load',()=>setTimeout(install,100));
</script></body></html>
