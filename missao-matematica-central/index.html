16px;border-radius:15px;background:#fff3e0;border:1px solid #ffd4a3;margin:12px 0}.visual-line{position:relative;height:74px;margin:18px 10px 8px}.visual-line:before{content:"";position:absolute;left:0;right:0;top:28px;height:3px;background:#334155}.ticks{display:flex;justify-content:space-between;position:absolute;left:0;right:0;top:18px}.tick{position:relative;width:2px;height:22px;background:#334155}.tick span{position:absolute;top:27px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700}.bar{display:flex;gap:3px;max-width:460px;margin:12px 0}.bar i{height:45px;flex:1;border:1.5px solid #334155;background:#fff}.bar i.fill{background:#81c784}.resource-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.resource{display:inline-block;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:800;background:#eef7f0;color:#246b2a;border:1px solid #d7ead9}.resource.video{background:#fff0f0;color:#a61b1b;border-color:#ffd0d0}.source-note{font-size:12px;color:#64748b;margin-top:10px}.question-box{max-width:820px;margin:20px auto;background:white;border:1px solid #e2e8f0;border-radius:24px;padding:22px;box-shadow:0 10px 26px rgba(16,24,40,.08)}.question-box h2{margin-top:0}.qtext{padding:14px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;line-height:1.55}.step{display:flex;gap:10px;margin:12px 0;align-items:flex-start}.step b{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:#2E7D32;color:#fff}.understand-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.understand-actions button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}.btn-green{background:#2E7D32;color:#fff}.btn-light{background:#eef7f0;color:#2E7D32}@media(max-width:820px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.topic-grid{grid-template-columns:1fr}.study-main{padding:16px 12px 32px}.lesson-card,.question-box{padding:16px;border-radius:18px}.study-hero{padding:20px}}

<body>

<div id="studyOverlay"><div class="study-top"><div class="study-top-inner"><button class="study-back" id="studyBack">← Voltar</button><div><div class="study-title" id="studyHeader">Central de Estudos</div><div class="study-sub">6º ano • explicações visuais e aulas confiáveis</div></div></div></div><main class="study-main"><section class="topics-home" id="topicsHome"><div class="study-hero"><div style="font-size:12px;font-weight:900;letter-spacing:.08em">CENTRAL DE ESTUDOS</div><h1>Entender antes de decorar.</h1><p>Escolha um tema. Leia uma parte de cada vez, observe os exemplos visuais e só depois tente os exercícios.</p></div><div class="topic-grid" id="topicGrid"></div></section><section class="topic-page" id="topicPage"></section></main></div>

<script>
const TOPICS=[
{id:'naturais',icon:'🔢',title:'Números naturais',desc:'Leitura, escrita, valor posicional e as quatro operações.',skills:'EF06MA01–03',explain:'Os números naturais aparecem em contagens e medidas inteiras. Antes de calcular, observe o valor que cada algarismo ocupa. Em 4 582, por exemplo, o 4 vale quatro milhares, o 5 vale cinco centenas, o 8 vale oito dezenas e o 2 vale duas unidades.',key:'Para verificar uma conta, estime antes. Se 398 + 604 está perto de 1 000, um resultado como 102 não pode fazer sentido.',example:'Exemplo: 2 347 + 1 508. Alinhe unidades com unidades, dezenas com dezenas, centenas com centenas e milhares com milhares.',links:[['OBMEP • Números naturais','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study'],['Khan Academy • Aritmética','https://pt.khanacademy.org/math/arithmetic-home','study']]},
{id:'divisibilidade',icon:'🧩',title:'Múltiplos, divisores e primos',desc:'Critérios de divisibilidade, fatores, números primos, MMC e MDC.',skills:'EF06MA05–06',explain:'Um múltiplo é resultado de uma multiplicação. Um divisor é um número que divide outro sem deixar resto. Por exemplo, 3 é divisor de 12 porque 12 ÷ 3 = 4, e 12 é múltiplo de 3.',key:'Número primo tem exatamente dois divisores naturais: 1 e ele mesmo.',example:'Para saber se 246 é divisível por 3, some os algarismos: 2 + 4 + 6 = 12. Como 12 é divisível por 3, 246 também é.',links:[['OBMEP • Divisibilidade','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study']]},
{id:'fracoes',icon:'🍕',title:'Frações: significado',desc:'Numerador, denominador, parte de um todo e fração de uma quantidade.',skills:'EF06MA07, EF06MA09',explain:'Uma fração representa partes iguais de um todo ou o resultado de uma divisão. O denominador diz em quantas partes iguais o inteiro foi dividido; o numerador diz quantas dessas partes estamos considerando.',key:'As partes precisam ser iguais. Dividir uma pizza em pedaços de tamanhos diferentes não representa corretamente uma fração do todo.',example:'3/4 significa três partes entre quatro partes iguais. Para calcular 3/4 de 20: 20 ÷ 4 = 5 e depois 5 × 3 = 15.',visual:'bar',links:[['Khan Academy • Frações','https://pt.khanacademy.org/math/arithmetic-home/arith-review-fractions/mult-unit-frac','study'],['OBMEP • Frações','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=28','study'],['Vídeo • Introdução às frações','https://pt.khanacademy.org/math/arithmetic/fraction-arithmetic/v/fraction-basics','video']]},
{id:'reta-fracoes',icon:'📏',title:'Frações na reta numérica',desc:'Como localizar 1/2, 3/4, 5/3 e outras frações na reta.',skills:'EF06MA07–08',explain:'Na reta numérica, o denominador informa em quantas partes iguais cada unidade deve ser dividida. Para marcar 3/2, divida cada intervalo entre inteiros em 2 partes iguais e conte três meios a partir do zero.',key:'O denominador controla o tamanho de cada passo. O numerador diz quantos passos você anda a partir do zero.',example:'Para marcar 3/2: 0 → 1/2 → 2/2 (=1) → 3/2. Portanto, 3/2 fica exatamente no meio entre 1 e 2.',visual:'line',links:[['Khan Academy • Frações na reta','https://pt.khanacademy.org/math/arithmetic-home/arith-review-fractions/mult-unit-frac','study'],['Vídeo Khan Academy • Frações na reta','https://www.youtube.com/watch?v=hTGFQpuiq8M','video']]},
{id:'equivalentes',icon:'⚖️',title:'Frações equivalentes e comparação',desc:'Equivalência, simplificação e comparação de frações.',skills:'EF06MA07',explain:'Frações equivalentes têm escritas diferentes, mas representam a mesma quantidade. Multiplicar ou dividir numerador e denominador pelo mesmo número não muda o valor da fração.',key:'1/2 = 2/4 = 3/6. Todas representam metade.',example:'Para comparar 2/3 e 3/4, use um denominador comum: 2/3 = 8/12 e 3/4 = 9/12. Então 2/3 < 3/4.',links:[['Khan Academy • Frações equivalentes','https://pt.khanacademy.org/math/arithmetic-home/arith-review-fractions/mult-unit-frac','study'],['OBMEP • Frações Parte 1','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=28','study']]},
{id:'soma-fracoes',icon:'➕',title:'Adição e subtração de frações',desc:'Denominadores iguais e diferentes, denominador comum e simplificação.',skills:'EF06MA10',explain:'Só podemos somar ou subtrair diretamente os numeradores quando as partes têm o mesmo tamanho, isto é, quando os denominadores são iguais. Se forem diferentes, transforme as frações em equivalentes com denominador comum.',key:'Não some denominadores. Em 1/4 + 2/4, as partes continuam sendo quartos; por isso o resultado é 3/4.',example:'1/2 + 1/3 → 3/6 + 2/6 = 5/6.',links:[['OBMEP • Operações com frações','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=28','study'],['Khan Academy • Denominadores comuns','https://pt.khanacademy.org/math/arithmetic/fraction-arithmetic/a/common-denominators-review','study']]},
{id:'mult-fracoes',icon:'✖️',title:'Multiplicação e divisão de frações',desc:'Parte de uma parte, inverso multiplicativo e problemas.',skills:'Ampliação do trabalho com racionais no material escolar',explain:'Multiplicar frações pode ser entendido como calcular uma parte de outra parte. Na divisão, perguntamos quantas vezes uma quantidade cabe em outra. No procedimento escolar, conserva-se a primeira fração e multiplica-se pelo inverso da segunda.',key:'Na divisão, apenas a segunda fração é invertida.',example:'3/4 ÷ 2/5 = 3/4 × 5/2. Depois multiplique e simplifique.',links:[['OBMEP • Frações Partes 4 e 5','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=28','study'],['Khan Academy • Frações','https://pt.khanacademy.org/math/arithmetic-home/arith-review-fractions/mult-unit-frac','study']]},
{id:'decimais',icon:'🔟',title:'Números decimais',desc:'Décimos, centésimos, milésimos, comparação e reta numérica.',skills:'EF06MA01–02, EF06MA08',explain:'A vírgula separa a parte inteira da parte decimal. O primeiro algarismo depois da vírgula representa décimos, o segundo centésimos e o terceiro milésimos.',key:'Zeros à direita não mudam o valor: 3,5 = 3,50. Para comparar, alinhe as casas decimais.',example:'4,08 e 4,8. Escreva 4,8 como 4,80. Como 08 centésimos é menor que 80 centésimos, 4,08 < 4,8.',visual:'decimal',links:[['Khan Academy • Números decimais','https://pt.khanacademy.org/math/arithmetic-home/arith-review-decimals/sub-decimals','study'],['Vídeo • Décimos na reta numérica','https://www.youtube.com/watch?v=mvovwg11wCw','video'],['OBMEP • Operações básicas','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=60','study']]},
{id:'operacoes-decimais',icon:'🧮',title:'Operações com decimais',desc:'Adição, subtração, multiplicação e divisão.',skills:'EF06MA11',explain:'Na soma e subtração, alinhe vírgula com vírgula. Na multiplicação, multiplique como inteiros e depois recoloque a vírgula contando as casas decimais. Na divisão por decimal, transforme o divisor em inteiro deslocando a vírgula nos dois números igualmente.',key:'Sempre faça uma estimativa para saber se a resposta é razoável.',example:'3,25 ÷ 0,25 → multiplique os dois por 100 → 325 ÷ 25 = 13.',links:[['Khan Academy • Decimais','https://pt.khanacademy.org/math/arithmetic-home/arith-review-decimals/sub-decimals','study'],['OBMEP • Operações básicas','https://portaldaobmep.impa.br/index.php/modulo/ver?modulo=60','study']]},
{id:'porcentagem',icon:'💯',title:'Porcentagem',desc:'Porcentagem como fração de 100, cálculo mental e problemas.',skills:'EF06MA13',explain:'Porcentagem significa “por 100”. Assim, 25% = 25/100 = 1/4. Antes de usar uma fórmula, pense em frações conhecidas: 50% é metade; 25% é a quarta parte; 10% é a décima parte.',key:'No 6º ano, vale compreender a proporcionalidade sem depender da regra de três.',example:'25% de 80 = 1/4 de 80 = 20.',links:[['OBMEP • Fração como porcentagem','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study'],['Khan Academy • Porcentagens','https://pt.khanacademy.org/math/pre-algebra/pre-algebra-fractions','study']]},
{id:'geometria',icon:'📐',title:'Geometria e plano cartesiano',desc:'Ângulos, polígonos, figuras planas, coordenadas e simetria.',skills:'EF06MA16–22',explain:'Em geometria, desenhar e nomear corretamente é parte da solução. Ângulos descrevem giros e aberturas; polígonos são figuras planas fechadas formadas por segmentos; no plano cartesiano, um ponto é localizado por um par de coordenadas.',key:'Primeiro observe a figura; depois identifique o que é dado e o que precisa ser descoberto.',example:'No ponto (3,2), avance 3 unidades no eixo horizontal e depois 2 no vertical.',links:[['OBMEP • 6º ano','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study'],['GeoGebra','https://www.geogebra.org/','study']]},
{id:'medidas',icon:'📦',title:'Grandezas e medidas',desc:'Comprimento, tempo, massa, capacidade, perímetro, área e volume.',skills:'EF06MA24–29',explain:'Antes de calcular, identifique a grandeza e a unidade. Comprimento usa unidades lineares; área mede superfície em unidades quadradas; volume mede espaço em unidades cúbicas; capacidade costuma usar litro e mililitro.',key:'Não misture unidades diferentes na mesma conta sem converter antes.',example:'Um retângulo de 5 cm por 3 cm tem perímetro 5+3+5+3 = 16 cm e área 5×3 = 15 cm².',links:[['OBMEP • Medidas','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study']]},
{id:'probabilidade',icon:'🎲',title:'Probabilidade',desc:'Experimentos aleatórios, casos possíveis e casos favoráveis.',skills:'EF06MA30',explain:'Probabilidade compara os resultados favoráveis com o total de resultados possíveis, quando todos têm a mesma chance. Ela pode ser escrita como fração, decimal ou porcentagem.',key:'Liste o espaço amostral antes de calcular.',example:'Em um dado comum, há 6 resultados possíveis. Para sair número par, são favoráveis 2, 4 e 6: 3/6 = 1/2.',links:[['OBMEP • Fração como probabilidade','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study']]},
{id:'estatistica',icon:'📊',title:'Tabelas e gráficos',desc:'Leitura, interpretação e organização de dados.',skills:'EF06MA31–32',explain:'Ler gráfico não é apenas olhar a maior barra. Observe título, legenda, eixos, unidades e escala. Em uma tabela, descubra primeiro o que cada linha e coluna representa.',key:'Antes de responder, diga com suas palavras o que o gráfico ou tabela está mostrando.',example:'Se o eixo vertical aumenta de 5 em 5, uma barra na terceira marca representa 15, não 3.',links:[['BNCC • Matemática 6º ano','https://basenacionalcomum.mec.gov.br/','study'],['OBMEP • 6º ano','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study']]},
{id:'interpretacao',icon:'🧠',title:'Interpretação de problemas',desc:'Dados, pergunta, operação, estratégia e verificação da resposta.',skills:'Transversal às habilidades EF06MA',explain:'Um problema não começa pela conta. Primeiro descubra o que foi dado, o que está sendo pedido e como essas informações se relacionam. Só depois escolha uma operação.',key:'Use quatro linhas: DADOS • PERGUNTA • OPERAÇÃO • RESPOSTA.',example:'“Tenho 4 L e cada copo tem 0,25 L.” A pergunta é quantos grupos de 0,25 cabem em 4. Isso indica divisão.',links:[['OBMEP • Resolução de exercícios','https://portaldaobmep.impa.br/index.php/modulo/lista?serie=1','study']]}
];
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}const study=document.getElementById('studyOverlay'),home=document.getElementById('topicsHome'),page=document.getElementById('topicPage');function renderGrid(){document.getElementById('topicGrid').innerHTML=TOPICS.map(t=>`<button class="topic-card" data-topic="${t.id}"><div class="icon">${t.icon}</div><h3>${t.title}</h3><p>${t.desc}</p></button>`).join('');document.querySelectorAll('.topic-card').forEach(b=>b.onclick=()=>showTopic(b.dataset.topic))}function visualFor(t){if(t.visual==='bar')return `<div class="bar">${[0,1,2,3].map(i=>`<i class="${i<3?'fill':''}"></i>`).join('')}</div><div><strong>3/4:</strong> três partes preenchidas de quatro partes iguais.</div>`;if(t.visual==='line')return `<div class="visual-line"><div class="ticks">${['0','1/2','1','3/2','2'].map(x=>`<i class="tick"><span>${x}</span></i>`).join('')}</div></div>`;if(t.visual==='decimal')return `<div class="visual-line"><div class="ticks">${['0','0,25','0,50','0,75','1'].map(x=>`<i class="tick"><span>${x}</span></i>`).join('')}</div></div>`;return ''}function showTopic(id){const t=TOPICS.find(x=>x.id===id);if(!t)return;home.classList.add('hidden');page.classList.add('show');document.getElementById('studyHeader').textContent=t.title;page.innerHTML=`<div class="lesson-card"><div style="font-size:30px">${t.icon}</div><h2>${t.title}</h2><p>${t.desc}</p><div class="source-note">Habilidades de referência: ${t.skills}</div></div><div class="lesson-card"><h3>1. Entenda a ideia</h3><p>${t.explain}</p>${visualFor(t)}<div class="keybox"><strong>O mais importante</strong><br>${t.key}</div></div><div class="lesson-card"><h3>2. Veja um exemplo</h3><p>${t.example}</p><div class="warnbox"><strong>Antes de seguir:</strong> tente explicar o exemplo com suas próprias palavras.</div></div><div class="lesson-card"><h3>3. Aprofunde</h3><p>Escolha apenas um recurso por vez. Antes de assistir, procure identificar qual ideia matemática está sendo explicada. Depois, responda: <strong>“Qual foi o primeiro passo e por quê?”</strong></p><div class="resource-row">${t.links.map(l=>`<a class="resource ${l[2]==='video'?'video':''}" target="_blank" rel="noopener" href="${l[1]}">${l[2]==='video'?'▶ ':''}${l[0]}</a>`).join('')}</div><div class="source-note">Recursos selecionados de Khan Academy Brasil, Portal da Matemática OBMEP/IMPA, BNCC e GeoGebra.</div></div>`;study.scrollTo({top:0})}document.getElementById('studyBack').onclick=()=>{if(page.classList.contains('show')){page.classList.remove('show');page.innerHTML='';home.classList.remove('hidden');document.getElementById('studyHeader').textContent='Central de Estudos';study.scrollTo({top:0})}else study.classList.remove('show')};renderGrid();
const base=document.getElementById('base');function findInnerApp(){try{const photo=base.contentDocument;const shell=photo?.getElementById('shell');const wrapper=shell?.contentDocument;const app=wrapper?.getElementById('app');return app||null}catch(e){return null}}function attachFeatures(){const app=findInnerApp();if(!app)return;const install=()=>{const d=app.contentDocument,w=app.contentWindow;if(!d||!d.body)return;if(!d.getElementById('centralCssV6')){const s=d.createElement('style');s.id='centralCssV6';s.textContent='.central-nav-v6{border-top:1px solid #e5e7eb!important;margin-top:7px!important;padding-top:12px!important}.understand-v6{background:#e3f2fd!important;color:#0d47a1!important;border:1px solid #bbdefb!important}.understand-v6:before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:#1565c0;color:#fff;margin-right:6px;font-size:12px}';d.head.appendChild(s)}function nav(){const n=d.getElementById('navList');if(!n)return;if(!n.querySelector('.central-nav-v6')){const b=d.createElement('button');b.className='nav-item central-nav-v6';b.innerHTML='<span class="dot">📚</span><span class="nav-text">Central de Estudos</span>';b.onclick=()=>study.classList.add('show');n.appendChild(b)}}function buttons(){d.querySelectorAll('.lesson.active .exercise').forEach((ex,i)=>{if(ex.querySelector('.understand-v6'))return;const row=ex.querySelector('.action-row')||ex;const b=d.createElement('button');b.className='btn understand-v6';b.type='button';b.textContent='Entender esta questão';b.onclick=()=>openUnderstand(ex,i,w,d);row.appendChild(b)})}let lock=false;const patch=()=>{if(lock)return;lock=true;setTimeout(()=>{try{nav();buttons()}finally{lock=false}},60)};new MutationObserver(patch).observe(d.body,{subtree:true,childList:true});patch()};if(app.contentDocument?.readyState==='complete')install();else app.addEventListener('load',install,{once:true})}
function openUnderstand(ex,index,w,d){
  const question=ex.querySelector('p')?.innerText||ex.innerText.split('Dica 1')[0]||'';
  const h1=ex.querySelector('.hint1')?.innerText||'';
  const h2=ex.querySelector('.hint2')?.innerText||'';
  const q=question.toLowerCase();
  let topic='interpretacao';
  if(q.includes('reta')&&(/\//.test(q))) topic='reta-fracoes';
  else if(q.includes('equivalent')||q.includes('compare')||q.includes('>')||q.includes('<')) topic='equivalentes';
  else if((q.includes('fração')||/\d+\s*\/\s*\d+/.test(question))&&(q.includes('+')||q.includes('-'))) topic='soma-fracoes';
  else if((q.includes('fração')||/\d+\s*\/\s*\d+/.test(question))&&(q.includes('×')||q.includes('÷'))) topic='mult-fracoes';
  else if(q.includes('fração')||/\d+\s*\/\s*\d+/.test(question)) topic='fracoes';
  else if(q.includes(',')||q.includes('decimal')) topic='decimais';
  const t=TOPICS.find(x=>x.id===topic)||TOPICS.find(x=>x.id==='interpretacao');

  const frac=(a,b)=>'<span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;font-weight:900;margin:0 4px"><span style="padding:0 5px 3px;border-bottom:2px solid currentColor">'+a+'</span><span style="padding-top:3px">'+b+'</span></span>';
  const pizza=(n=3,dn=4)=>'<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="width:128px;height:128px;border-radius:50%;border:8px solid #d69b52;background:conic-gradient(#f6c453 0 '+(n/dn*100)+'%,#fff8e7 '+(n/dn*100)+'% 100%);position:relative;box-shadow:inset 0 0 0 3px #e9a83a"><i style="position:absolute;width:14px;height:14px;border-radius:50%;background:#c62828;left:28px;top:28px"></i><i style="position:absolute;width:14px;height:14px;border-radius:50%;background:#c62828;right:25px;top:43px"></i><i style="position:absolute;width:14px;height:14px;border-radius:50%;background:#c62828;left:48px;bottom:24px"></i></div><div><strong>Imagine uma pizza de verdade.</strong><br>Ela foi cortada em <b>'+dn+' pedaços iguais</b> e estamos olhando para <b>'+n+' deles</b>.</div></div>';
  const chocolate=(n=4,dn=6)=>'<div><div style="display:grid;grid-template-columns:repeat('+dn+',42px);gap:4px;margin:12px 0;max-width:100%;overflow:auto">'+Array.from({length:dn},(_,i)=>'<span style="height:48px;border-radius:7px;border:3px solid #6d3b20;background:'+(i<n?'#9a5a31':'#f2dfcf')+';box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)"></span>').join('')+'</div><strong>'+n+' quadradinhos escolhidos de '+dn+' quadradinhos iguais.</strong></div>';
  const numberline=()=>'<div style="padding:18px 10px 38px"><div style="height:5px;background:#334155;position:relative;margin:24px 8px"><span style="position:absolute;left:0;top:-10px;width:3px;height:25px;background:#334155"></span><span style="position:absolute;left:25%;top:-10px;width:3px;height:25px;background:#2E7D32"></span><span style="position:absolute;left:50%;top:-10px;width:3px;height:25px;background:#334155"></span><span style="position:absolute;left:75%;top:-10px;width:3px;height:25px;background:#2E7D32"></span><span style="position:absolute;right:0;top:-10px;width:3px;height:25px;background:#334155"></span><b style="position:absolute;left:0;top:20px;transform:translateX(-50%)">0</b><b style="position:absolute;left:25%;top:20px;transform:translateX(-50%)">'+frac(1,2)+'</b><b style="position:absolute;left:50%;top:20px;transform:translateX(-50%)">1</b><b style="position:absolute;left:75%;top:20px;transform:translateX(-50%)">'+frac(3,2)+'</b><b style="position:absolute;right:0;top:20px;transform:translateX(50%)">2</b></div></div>';

  let objective='Primeiro descubra exatamente o que precisa ser encontrado.';
  let concrete='<div class="visual-stage">'+chocolate()+'</div>';
  let worked='Veja um exemplo parecido antes de voltar para a sua questão.';
  let practice='Agora faça somente o primeiro passo da sua questão no caderno.';
  if(topic==='fracoes'){
    objective='Aqui aparece uma fração. Antes de fazer qualquer conta, precisamos entender o que o número de baixo e o número de cima estão dizendo.';
    concrete='<div class="visual-stage">'+pizza(3,4)+'</div>';
    worked='<b>Exemplo:</b> para calcular '+frac(2,3)+' de 18, divida 18 em <b>3 grupos iguais</b>: 18 ÷ 3 = 6. Depois pegue <b>2 grupos</b>: 6 × 2 = 12. A ordem faz sentido porque o denominador diz em quantas partes dividir e o numerador diz quantas partes pegar.';
    practice='Pergunte a si mesma: “em quantas partes iguais eu devo dividir primeiro?”';
  }
  if(topic==='reta-fracoes'){
    objective='A reta é como uma régua. O denominador diz em quantos pedacinhos iguais cada unidade será dividida; o numerador diz quantos desses passos você anda desde o zero.';
    concrete='<div class="visual-stage"><div style="font-size:16px"><b>Imagine uma régua:</b> entre 0 e 1 existe espaço. Se o denominador é 2, corte esse espaço exatamente ao meio.</div>'+numberline()+'</div>';
    worked='<b>Exemplo:</b> '+frac(3,2)+' significa <b>três passos de meio</b>. Comece no 0: primeiro passo → '+frac(1,2)+'. Segundo → '+frac(2,2)+' = 1. Terceiro → '+frac(3,2)+'. Por isso '+frac(3,2)+' fica depois do 1 e antes do 2.';
    practice='Antes de desenhar tudo, marque apenas 0, 1 e 2. Depois divida cada espaço conforme o denominador.';
  }
  if(topic==='equivalentes'){
    concrete='<div class="visual-stage">'+chocolate(3,6)+'<p>Se juntarmos cada dois quadradinhos, temos 3 grupos; metade da barra continua sendo metade. Mudar a divisão não muda a quantidade.</p></div>';
    worked='<b>Exemplo:</b> '+frac(1,2)+' = '+frac(2,4)+'. Multiplicamos <b>em cima e embaixo pelo mesmo número</b>. A quantidade não mudou; só mudou a forma de escrevê-la.';
    practice='Procure qual multiplicação transforma um denominador no outro. Faça a mesma coisa no numerador.';
  }
  if(topic==='soma-fracoes'){
    concrete='<div class="visual-stage"><b>Pense em pedaços de pizza.</b> Um meio e um quarto não são pedaços do mesmo tamanho. Antes de juntar, precisamos “cortar” tudo no mesmo tamanho.</div>';
    worked='<b>Exemplo:</b> '+frac(1,2)+' + '+frac(1,4)+'. Transforme '+frac(1,2)+' em '+frac(2,4)+'. Agora os pedaços têm o mesmo tamanho: '+frac(2,4)+' + '+frac(1,4)+' = '+frac(3,4)+'.';
    practice='Olhe os denominadores. Eles já são iguais? Se não forem, esse é o primeiro problema a resolver.';
  }
  if(topic==='decimais'){
    concrete='<div class="visual-stage"><div style="font-size:30px">💰 R$ 4,08 &nbsp; ou &nbsp; 💰 R$ 4,80?</div><p>Dinheiro ajuda a enxergar: R$ 4,08 são 4 reais e 8 centavos; R$ 4,80 são 4 reais e 80 centavos.</p></div>';
    worked='<b>Exemplo:</b> 4,8 pode ser escrito como 4,80. Assim fica mais fácil comparar 4,08 com 4,80. Primeiro compare a parte inteira; depois décimos; depois centésimos.';
    practice='Alinhe as vírgulas e compare uma casa de cada vez.';
  }

  document.getElementById('understandBox').innerHTML=
    '<div style="font-size:12px;font-weight:900;color:#2E7D32;letter-spacing:.08em">UMA COISA DE CADA VEZ</div>'+
    '<h2 style="font-size:28px;margin:6px 0 14px">Vamos descobrir juntas o que fazer</h2>'+
    '<div class="qtext" style="font-size:18px"><b>Sua questão:</b><br>'+esc(question)+'</div>'+
    '<div class="lesson-card"><h3>1. Primeiro: o que essa questão quer?</h3><p style="font-size:17px">'+objective+'</p><div class="attention-note"><b>Não faça a conta ainda.</b> Tente falar com suas palavras o que você precisa descobrir.</div></div>'+
    '<div class="lesson-card"><h3>2. Vamos enxergar a ideia</h3>'+concrete+'</div>'+
    '<div class="lesson-card"><h3>3. Veja um exemplo parecido</h3><p style="font-size:17px;line-height:1.7">'+worked+'</p></div>'+
    (h1?'<div class="lesson-card"><h3>4. Agora uma pista para A SUA questão</h3><div class="keybox" style="font-size:17px">'+esc(h1)+'</div>'+(h2?'<details style="margin-top:12px"><summary style="font-weight:900;cursor:pointer;color:#2E7D32">Ainda não entendi. Mostrar outra pista.</summary><div class="warnbox">'+esc(h2)+'</div></details>':'')+'</div>':'')+
    '<div class="lesson-card"><h3>5. Sua vez</h3><div class="mini-check" style="font-size:17px">'+practice+'<br><br><b>Faça só esse passo. Depois confira se ele faz sentido.</b></div></div>'+
    '<div class="understand-actions"><button class="btn-green" id="openTopicFromQ">Quero estudar '+t.title+'</button><button class="btn-light" id="closeUnderstand">Voltar para a questão</button></div>';
  document.getElementById('closeUnderstand').onclick=()=>document.getElementById('understandOverlay').classList.remove('show');
  document.getElementById('openTopicFromQ').onclick=()=>{document.getElementById('understandOverlay').classList.remove('show');study.classList.add('show');showTopic(t.id)};
  document.getElementById('understandOverlay').classList.add('show');
  document.getElementById('understandOverlay').scrollTo({top:0});
}
document.getElementById('understandBack').onclick=()=>document.getElementById('understandOverlay').classList.remove('show');base.addEventListener('load',()=>setTimeout(attachFeatures,100));
</script>
</body>
</html>
