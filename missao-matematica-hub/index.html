<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Missão Matemática</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf8}#shell{display:block;width:100%;height:100dvh;border:0}</style>
</head>
<body>
<iframe id="shell" src="/missao-matematica-publica-v2/index.html" title="Missão Matemática"></iframe>
<script>
const shell=document.getElementById('shell');
const DB_NAME='missao-matematica-files-v1';
const GRADE_KEY='missao-matematica-grades-v1';
const PASSING_GRADE=6;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getPhoto(key){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function putPhoto(obj){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function delPhoto(key){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function profile(){try{return JSON.parse(localStorage.getItem('missao-matematica-student-v1')||'null')}catch(e){return null}}
function grades(){try{return JSON.parse(localStorage.getItem(GRADE_KEY)||'{"blocks":{}}')}catch(e){return {blocks:{}}}}
function saveGrades(g){g.updatedAt=new Date().toISOString();localStorage.setItem(GRADE_KEY,JSON.stringify(g));refreshResultIfOpen()}
window.MissaoNotas={
 salvarBloco(bloco,nota){const n=Number(nota);if(bloco<1||bloco>11||!Number.isFinite(n)||n<0||n>10)throw new Error('Bloco 1–11 e nota 0–10.');const g=grades();g.blocks=g.blocks||{};g.blocks[String(bloco)]=n;saveGrades(g)},
 salvarAvaliacao(nota){const n=Number(nota);if(!Number.isFinite(n)||n<0||n>10)throw new Error('Nota 0–10.');const g=grades();g.exam=n;saveGrades(g)},
 limpar(){localStorage.removeItem(GRADE_KEY);refreshResultIfOpen()},
 dados(){return grades()}
};
function attach(){
 const pub=shell.contentDocument;if(!pub)return;const app=pub.getElementById('app');if(!app)return;
 const install=()=>{
  const w=app.contentWindow,d=app.contentDocument;if(!d||!d.body)return;
  if(!d.getElementById('hubCssV1')){const s=d.createElement('style');s.id='hubCssV1';s.textContent=`
  .hub-photo{margin-top:16px}.hub-drop{border:2px dashed #64b5f6;border-radius:18px;padding:20px;background:#f7fbff;text-align:center;cursor:pointer;transition:.18s;outline:none}.hub-drop:hover,.hub-drop.drag{border-color:#1565c0;background:#e3f2fd}.hub-drop .ico{font-size:30px;line-height:1;margin-bottom:8px}.hub-drop strong{display:block;color:#0f3d6e;font-size:15px}.hub-drop small{display:block;color:#64748b;margin-top:6px}.hub-preview{display:none;margin-top:12px;border:1px solid #dbe4ee;border-radius:16px;padding:10px;background:#fff}.hub-preview.show{display:block}.hub-preview img{display:block;max-width:100%;max-height:420px;margin:0 auto;border-radius:12px;object-fit:contain;background:#f8fafc}.hub-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;font-size:12px;color:#64748b}.hub-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.hub-actions button{border:0;border-radius:11px;padding:8px 11px;font-weight:800;cursor:pointer}.hub-replace{background:#eef7f0;color:#2E7D32}.hub-remove{background:#fff0f0;color:#b91c1c}.hub-note{font-size:12px;color:#64748b;margin-top:8px}.exam-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.exam-photo-card{border:1px solid #dbe4ee;border-radius:14px;padding:8px;background:#fff}.exam-photo-card img{width:100%;height:180px;object-fit:contain;border-radius:10px;background:#f8fafc}.exam-photo-card button{margin-top:7px;border:0;border-radius:9px;padding:7px 9px;background:#fff0f0;color:#b91c1c;font-weight:800}.result-nav-hub{border-top:1px solid #e5e7eb!important;margin-top:7px!important;padding-top:12px!important}.result-card-hub{background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 10px 28px rgba(16,24,40,.09);padding:22px;margin-bottom:16px}.result-grid-hub{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.result-box-hub{padding:14px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0}.result-box-hub strong{display:block;font-size:28px}.status-hub{padding:16px;border-radius:16px;font-weight:900;margin-top:14px}.status-hub.ok{background:#e8f5e9;color:#225b25;border:1px solid #c8e6c9}.status-hub.wait{background:#fff8e1;color:#7c4a03;border:1px solid #ffe0a3}.status-hub.no{background:#ffebee;color:#8b1e1e;border:1px solid #ffcdd2}.grade-list-hub{display:grid;gap:7px;margin-top:12px}.grade-row-hub{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}@media(max-width:700px){.exam-photo-grid,.result-grid-hub{grid-template-columns:1fr}.hub-meta{display:block}}
  `;d.head.appendChild(s)}
  const getState=()=>{try{return w.eval('state')}catch(e){return null}};const getLessons=()=>{try{return w.eval('lessons')}catch(e){return []}};
  async function addBlockPhoto(){
   const st=getState(),less=getLessons();if(!st||st.current>=less.length)return;const stop=d.querySelector('.lesson.active .photo-stop');if(!stop||stop.querySelector('.hub-photo'))return;
   const block=st.current+1,key='block-'+block,p=profile(),wrap=d.createElement('div');wrap.className='hub-photo';
   wrap.innerHTML=`<div class="hub-drop" tabindex="0" role="button"><div class="ico">📷</div><strong>Anexar 1 foto com todas as respostas deste bloco</strong><small>Clique para escolher uma imagem ou arraste e solte aqui.</small><input type="file" accept="image/*" hidden></div><div class="hub-preview"><img alt="Foto das respostas do bloco ${block}"><div class="hub-meta"><span class="hub-name"></span><span class="hub-date"></span></div><div class="hub-actions"><button class="hub-replace" type="button">Trocar foto</button><button class="hub-remove" type="button">Remover foto</button></div></div><div class="hub-note">Esta foto será usada na correção do Bloco ${block}. A nota do bloco entra na média dos estudos.</div>`;
   stop.appendChild(wrap);const drop=wrap.querySelector('.hub-drop'),input=wrap.querySelector('input'),preview=wrap.querySelector('.hub-preview'),img=wrap.querySelector('img'),name=wrap.querySelector('.hub-name'),date=wrap.querySelector('.hub-date');let url=null;
   async function refresh(){const item=await getPhoto(key);if(url){URL.revokeObjectURL(url);url=null}if(item?.blob){url=URL.createObjectURL(item.blob);img.src=url;name.textContent=item.name||'Foto do bloco';date.textContent=new Date(item.updatedAt).toLocaleString('pt-BR');preview.classList.add('show');drop.style.display='none'}else{img.removeAttribute('src');preview.classList.remove('show');drop.style.display='block'}}
   async function save(file){if(!file||!file.type.startsWith('image/')){w.alert('Selecione uma imagem.');return}if(file.size>20*1024*1024){w.alert('A imagem é muito grande. Use uma foto com até 20 MB.');return}await putPhoto({key,block,blob:file,name:file.name||('bloco-'+block+'.jpg'),type:file.type,size:file.size,student:p?.name||'',date:p?.dateISO||'',updatedAt:new Date().toISOString()});await refresh()}
   drop.onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};input.onchange=()=>{if(input.files?.[0])save(input.files[0]);input.value=''};['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f)save(f)});wrap.querySelector('.hub-replace').onclick=()=>input.click();wrap.querySelector('.hub-remove').onclick=async()=>{if(w.confirm('Remover a foto deste bloco?')){await delPhoto(key);await refresh()}};await refresh();
  }
  async function addExamPhotos(){
   const root=d.querySelector('#examRootV4');if(!root)return;const stop=root.querySelector('.photo-stop');if(!stop||stop.querySelector('.exam-photo-hub'))return;const box=d.createElement('div');box.className='exam-photo-hub hub-photo';box.innerHTML=`<div class="hub-drop exam-drop-hub" tabindex="0" role="button"><div class="ico">📸</div><strong>Anexe as fotos das contas da Avaliação Final</strong><small>Selecione ou arraste até 4 imagens. Elas serão consideradas junto com as respostas digitadas na correção.</small><input type="file" accept="image/*" multiple hidden></div><div class="exam-photo-grid"></div><div class="hub-note">A Avaliação Final só poderá ser finalizada depois de anexar pelo menos uma foto das contas.</div>`;stop.insertBefore(box,stop.firstChild);
   const drop=box.querySelector('.exam-drop-hub'),input=box.querySelector('input'),grid=box.querySelector('.exam-photo-grid');
   async function refresh(){grid.innerHTML='';for(let i=1;i<=4;i++){const item=await getPhoto('exam-'+i);if(!item?.blob)continue;const url=URL.createObjectURL(item.blob),card=d.createElement('div');card.className='exam-photo-card';card.innerHTML=`<img alt="Foto ${i} da avaliação"><button type="button">Remover foto ${i}</button>`;card.querySelector('img').src=url;card.querySelector('button').onclick=async()=>{await delPhoto('exam-'+i);URL.revokeObjectURL(url);await refresh()};grid.appendChild(card)}}
   async function saveFiles(files){const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length){w.alert('Selecione uma imagem.');return}const existing=[];for(let i=1;i<=4;i++)if(await getPhoto('exam-'+i))existing.push(i);let slots=[1,2,3,4].filter(i=>!existing.includes(i));for(const file of imgs.slice(0,slots.length)){if(file.size>20*1024*1024)continue;const i=slots.shift(),p=profile();await putPhoto({key:'exam-'+i,exam:true,blob:file,name:file.name||('avaliacao-'+i+'.jpg'),type:file.type,size:file.size,student:p?.name||'',date:p?.dateISO||'',updatedAt:new Date().toISOString()})}await refresh()}
   drop.onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};input.onchange=()=>{saveFiles(input.files||[]);input.value=''};['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>saveFiles(e.dataTransfer?.files||[]));await refresh();
   const finish=d.getElementById('finishExamV4');if(finish&&!finish.dataset.photoGuard){finish.dataset.photoGuard='1';const original=finish.onclick;finish.onclick=async()=>{let count=0;for(let i=1;i<=4;i++)if(await getPhoto('exam-'+i))count++;if(!count){w.alert('Antes de finalizar, anexe pelo menos uma foto das contas da avaliação.');return}if(typeof original==='function')original.call(finish)}}
  }
  function addResultNav(){const nav=d.getElementById('navList');if(!nav||nav.querySelector('.result-nav-hub'))return;const b=d.createElement('button');b.className='nav-item result-nav-hub';b.innerHTML='<span class="dot">📊</span><span class="nav-text">Resultado Geral</span>';b.onclick=showResult;nav.appendChild(b)}
  function showResult(){const main=d.getElementById('main'),g=grades(),blocks=g.blocks||{},vals=[];for(let i=1;i<=11;i++){const v=Number(blocks[String(i)]);if(Number.isFinite(v))vals.push(v)}const study=vals.length===11?vals.reduce((a,b)=>a+b,0)/11:null,exam=Number.isFinite(Number(g.exam))?Number(g.exam):null,overall=study!==null&&exam!==null?(study+exam)/2:null;let status='<div class="status-hub wait">Aguardando correção. As notas aparecem aqui depois que os exercícios e a avaliação forem corrigidos.</div>';if(overall!==null)status=overall>=PASSING_GRADE?'<div class="status-hub ok">APROVADA no simulado/plano de estudos • média '+overall.toFixed(1).replace('.',',')+'</div>':'<div class="status-hub no">AINDA NÃO ATINGIU A MÉDIA do simulado • média '+overall.toFixed(1).replace('.',',')+'</div>';const rows=Array.from({length:11},(_,i)=>`<div class="grade-row-hub"><span>Bloco ${i+1}</span><strong>${Number.isFinite(Number(blocks[String(i+1)]))?Number(blocks[String(i+1)]).toFixed(1).replace('.',','):'Aguardando'}</strong></div>`).join('');main.innerHTML=`<div class="result-card-hub"><span class="section-kicker">Resultado Geral</span><h2>Desempenho de ${profile()?.name||'estudante'}</h2><p>A média dos 11 blocos vale 50% e a Avaliação Final vale 50%. Média mínima atual: <strong>${PASSING_GRADE.toFixed(1).replace('.',',')}</strong>.</p><div class="result-grid-hub"><div class="result-box-hub"><span>Blocos corrigidos</span><strong>${vals.length}/11</strong></div><div class="result-box-hub"><span>Média dos estudos</span><strong>${study===null?'—':study.toFixed(1).replace('.',',')}</strong></div><div class="result-box-hub"><span>Avaliação final</span><strong>${exam===null?'—':exam.toFixed(1).replace('.',',')}</strong></div></div>${status}<h3 style="margin-top:22px">Notas dos blocos</h3><div class="grade-list-hub">${rows}</div><div class="footer-nav"><button class="btn btn-primary" id="resultBackHub">Voltar aos estudos</button></div></div>`;d.getElementById('resultBackHub').onclick=()=>w.go(Math.min(getState()?.current||0,10));w.scrollTo({top:0,behavior:'smooth'})}
  window.__showHubResult=showResult;
  let lock=false;const patch=()=>{if(lock)return;lock=true;setTimeout(async()=>{try{await addBlockPhoto();await addExamPhotos();addResultNav()}finally{lock=false}},50)};new MutationObserver(patch).observe(d.body,{childList:true,subtree:true});patch();
 };
 if(app.contentDocument?.readyState==='complete')install();else app.addEventListener('load',install,{once:true})
}
function refreshResultIfOpen(){try{const pub=shell.contentDocument,app=pub?.getElementById('app'),fn=app?.contentWindow?.__showHubResult;if(typeof fn==='function'&&app.contentDocument.querySelector('.result-card-hub'))fn()}catch(e){}}
shell.addEventListener('load',attach);
</script>
</body>
</html>
