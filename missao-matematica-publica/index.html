<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<title>Missão Matemática • 6º ano</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7faf8}iframe{display:block;width:100%;height:100dvh;border:0;background:#f7faf8}</style>
</head>
<body>
<iframe id="app" src="/missao-matematica-6ano/index.html" title="Missão Matemática 6º ano"></iframe>
<script>
const frame=document.getElementById('app');
const EXAM=[
['Fração','Fácil',0.30,'Na fração 5/8, qual é o numerador e qual é o denominador?'],
['Fração','Fácil',0.30,'Uma barra foi dividida em 6 partes iguais e 4 foram usadas. Que fração representa a parte usada?'],
['Fração','Fácil',0.30,'Calcule 3/7 + 2/7 e simplifique, se possível.'],
['Fração','Fácil',0.30,'Calcule 7/10 - 3/10.'],
['Fração','Média',0.50,'Complete a fração equivalente: 2/3 = __/12. Mostre como encontrou o número.'],
['Fração','Média',0.50,'Calcule 1/2 + 1/4. Mostre a transformação para denominadores iguais.'],
['Fração','Média',0.50,'Calcule 5/6 - 1/3 e apresente a resposta na forma mais simples possível.'],
['Fração','Média',0.50,'Calcule 3/5 × 10/9 e simplifique o resultado.'],
['Fração','Difícil',0.90,'Uma garrafa tem 2 L de água. Cada copo comporta 1/4 L. Quantos copos completos podem ser servidos? Escreva DADOS, PERGUNTA, OPERAÇÃO e faça a conta.'],
['Fração','Difícil',0.90,'Uma pessoa percorreu 2/5 de uma trilha pela manhã e 1/3 à tarde. a) Que fração percorreu ao todo? b) Que fração ainda falta? Mostre o raciocínio.'],
['Decimal','Fácil',0.30,'Escreva a fração decimal 7/10 na forma de número decimal.'],
['Decimal','Fácil',0.30,'Escreva 0,35 como uma fração decimal.'],
['Decimal','Fácil',0.30,'Complete com >, < ou = : 3,5 __ 3,50.'],
['Decimal','Fácil',0.30,'Calcule 2,58 + 3,20.'],
['Decimal','Média',0.50,'Calcule 10,01 - 9,70. Organize corretamente os números antes de subtrair.'],
['Decimal','Média',0.50,'Coloque em ordem crescente: 1,9 ; 1,09 ; 1,99 ; 1,909.'],
['Decimal','Média',0.50,'Calcule 2,5 × 3,2 e mostre como determinou a posição da vírgula.'],
['Decimal','Média',0.50,'Calcule 84,6 ÷ 3.'],
['Decimal','Difícil',0.90,'Uma garrafa contém 3,25 L de refrigerante. Cada copo comporta 0,25 L. Quantos copos completos podem ser servidos? Escreva DADOS, PERGUNTA, OPERAÇÃO e faça a divisão.'],
['Decimal','Difícil',0.90,'1 kg de carne custa R$ 32,90. Uma pessoa comprou 2,7 kg. a) Qual foi o valor da compra? b) Se pagou com R$ 100,00, qual foi o troco? Mostre todas as operações.']
];
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 const css=d.createElement('style');
 css.textContent=`
 .hero-card{isolation:isolate!important}.hero-card>*{position:relative!important;z-index:1!important}.hero-card:after{z-index:0!important;pointer-events:none!important;opacity:.35!important}
 .frac-v2{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1;margin:0 .12em;min-width:1.25em}.frac-v2 .n{border-bottom:1.6px solid currentColor;padding:0 .12em .10em}.frac-v2 .d{padding:.10em .12em 0}
 .resp-v2{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:13px;padding:10px 12px;margin-top:10px;resize:vertical;font:inherit;background:#fff}.resp-v2:focus{outline:3px solid rgba(46,125,50,.14);border-color:#66bb6a}.save-v2{font-size:12px;color:#64748b;margin-top:5px}
 .exam-nav-v2{border-top:1px solid #e5e7eb!important;margin-top:7px!important;padding-top:12px!important}.exam-card-v2{background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 10px 28px rgba(16,24,40,.09);padding:22px;margin-bottom:16px}.exam-hero-v2{background:linear-gradient(145deg,#0f5132,#2e7d32);color:#fff;border:none}.exam-hero-v2 p{color:#e8f5e9}.weight-v2{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#eef2f7;color:#475569;white-space:nowrap}.q-v2{border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin:10px 0;background:#fcfdfc}.qtop-v2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.qnum-v2{font-size:12px;font-weight:900;color:#2E7D32;letter-spacing:.06em;text-transform:uppercase}.sum-v2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.sum-v2>div{padding:10px;border-radius:14px;background:rgba(255,255,255,.10);text-align:center}.sum-v2 strong{font-size:20px;display:block}
 @media(max-width:780px){.hero-card:after{width:150px!important;height:150px!important;right:-40px!important;top:-40px!important;opacity:.16!important}.hero h2{max-width:86%!important}.qtop-v2{display:block}.weight-v2{margin-top:6px}.sum-v2{grid-template-columns:1fr}}
 `;d.head.appendChild(css);
 let busy=false;
 const state=()=>{try{return w.eval('state')}catch(e){return null}};
 const lessons=()=>{try{return w.eval('lessons')}catch(e){return []}};
 function fracify(root){
   const walker=d.createTreeWalker(root||d.body,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName)||p.closest('.frac-v2'))return NodeFilter.FILTER_REJECT;return /\d+\s*\/\s*\d+/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
   const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
   nodes.forEach(n=>{const f=d.createDocumentFragment(),parts=n.nodeValue.split(/(\d+\s*\/\s*\d+)/g);parts.forEach(x=>{const m=x.match(/^(\d+)\s*\/\s*(\d+)$/);if(m){const s=d.createElement('span');s.className='frac-v2';s.setAttribute('aria-label',m[1]+' sobre '+m[2]);s.innerHTML='<span class="n">'+m[1]+'</span><span class="d">'+m[2]+'</span>';f.appendChild(s)}else f.appendChild(d.createTextNode(x))});n.replaceWith(f)});
 }
 function addStudyInputs(){
   const st=state();if(!st||st.current>=lessons().length)return;
   const saved=JSON.parse(localStorage.getItem('missao-matematica-study-answers-v1')||'{}');
   d.querySelectorAll('.lesson.active .exercise').forEach((ex,j)=>{if(ex.querySelector('.resp-v2'))return;const key='b'+(st.current+1)+'q'+(j+1);const ta=d.createElement('textarea');ta.className='resp-v2';ta.placeholder='Resposta final (opcional)';ta.value=saved[key]||'';ta.addEventListener('input',()=>{const x=JSON.parse(localStorage.getItem('missao-matematica-study-answers-v1')||'{}');x[key]=ta.value;localStorage.setItem('missao-matematica-study-answers-v1',JSON.stringify(x))});const note=d.createElement('div');note.className='save-v2';note.textContent='Salvo automaticamente neste aparelho.';ex.append(ta,note)});
 }
 function addExamNav(){
   const nav=d.getElementById('navList');if(!nav||nav.querySelector('.exam-nav-v2'))return;const st=state(),ok=st&&st.done&&st.done.length===lessons().length;const b=d.createElement('button');b.className='nav-item exam-nav-v2'+(ok?'':' locked');b.innerHTML='<span class="dot">'+(ok?'★':'🔒')+'</span><span class="nav-text">Avaliação Final</span>';b.onclick=showExam;nav.appendChild(b);
 }
 function renderExam(){
   const st=state(),ok=st&&st.done&&st.done.length===lessons().length,main=d.getElementById('main');if(!main)return;
   if(!ok){main.innerHTML='<div class="exam-card-v2"><span class="section-kicker">Avaliação Final</span><h2>A avaliação ainda está bloqueada</h2><p>Conclua os 11 blocos de estudo primeiro. A prova ficará disponível no final da trilha.</p></div>';return}
   const ans=JSON.parse(localStorage.getItem('missao-matematica-exam-v1')||'{}');
   let qs=EXAM.map((q,i)=>`<div class="q-v2"><div class="qtop-v2"><div><div class="qnum-v2">${q[0]} • Questão ${i+1}</div><p>${q[3]}</p></div><span class="weight-v2">${q[1]} • ${q[2].toFixed(2).replace('.',',')} pt</span></div><textarea class="resp-v2 exam-resp-v2" data-i="${i}" placeholder="Digite a resposta final. As contas ficam no caderno.">${(ans[i]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea><div class="save-v2">Salvo automaticamente neste aparelho.</div></div>`).join('');
   main.innerHTML=`<div class="exam-card-v2 exam-hero-v2"><span class="section-kicker" style="background:rgba(255,255,255,.14);color:#fff">Avaliação Final</span><h2>Simulado de Recuperação</h2><p>20 questões: 10 de frações e 10 de números decimais. Nota total: 10,0 pontos.</p><div class="sum-v2"><div><strong>8</strong>fáceis<br>0,30 cada</div><div><strong>8</strong>médias<br>0,50 cada</div><div><strong>4</strong>difíceis<br>0,90 cada</div></div></div><div class="exam-card-v2"><div class="callout orange"><strong>REGRAS</strong>Faça todas as contas no caderno. Nas questões com texto, escreva DADOS, PERGUNTA e OPERAÇÃO. O aplicativo não mostra o gabarito.</div>${qs}<div class="photo-stop"><h3>FINALIZAR AVALIAÇÃO</h3><p>Confira as 20 respostas e depois tire fotos das contas no caderno para correção.</p><button class="btn btn-orange" id="finishExamV2">Finalizar avaliação</button></div></div>`;
   d.querySelectorAll('.exam-resp-v2').forEach(ta=>ta.addEventListener('input',()=>{const x=JSON.parse(localStorage.getItem('missao-matematica-exam-v1')||'{}');x[ta.dataset.i]=ta.value;localStorage.setItem('missao-matematica-exam-v1',JSON.stringify(x))}));
   d.getElementById('finishExamV2').onclick=()=>{const x=JSON.parse(localStorage.getItem('missao-matematica-exam-v1')||'{}'),n=Object.values(x).filter(v=>String(v).trim()).length;if(n<20){w.alert('Você respondeu '+n+' de 20 questões. Complete as que faltam antes de finalizar.');return}localStorage.setItem('missao-matematica-exam-status','finalizada');w.alert('Avaliação finalizada. Agora envie as fotos das contas no caderno para correção.')};fracify(main);
 }
 function showExam(){const st=state();if(st){st.current=lessons().length;localStorage.setItem('missao-matematica-state',JSON.stringify(st))}renderExam();w.scrollTo({top:0,behavior:'smooth'})}
 function patch(){if(busy)return;busy=true;setTimeout(()=>{try{const st=state();if(st&&st.current===lessons().length)renderExam();else{fracify(d.body);addStudyInputs()}addExamNav()}finally{busy=false}},30)}
 const obs=new MutationObserver(patch);obs.observe(d.body,{childList:true,subtree:true});patch();
});
</script>
</body>
</html>
